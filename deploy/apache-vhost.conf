# Enable mod_proxy, mod_proxy_http, mod_rewrite, and mod_headers before using.
<VirtualHost *:80>
    ServerName matta.example.local
    DocumentRoot /srv/matta/dist

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:3001/api/
    ProxyPassReverse /api/ http://127.0.0.1:3001/api/

    <Directory /srv/matta/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    <Directory /srv/matta/dist/assets>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
</VirtualHost>
